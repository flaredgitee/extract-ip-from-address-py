[project]
name = "extract-ip"
version = "0.1.0"
description = "Extract IP from an address string."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
extract-ip-from-address = "extract-ip-from-address.app:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["extract-ip-from-address*"]

[tool.poetry]
packages = [{ include = "extract-ip-from-address", from = "src" }]
